<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Patient EMR</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💜</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100vh; }
  body {
    background: #eff5fa; color: #24384d;
    font-family: "Sarabun", "IBM Plex Sans Thai", "Segoe UI", Tahoma, sans-serif;
    font-size: 15px; display: flex; flex-direction: column;
  }

  .emr-top {
    display: flex; align-items: center; gap: 12px; flex: 0 0 auto;
    background: #d7e9f7; border-bottom: 1px solid #c2dcf0; padding: 9px 16px;
  }
  .emr-top .ttl { font-weight: 700; color: #17486e; }
  .emr-top #emrPatient { color: #1f5682; font-weight: 600; }
  .emr-top #emrVn { color: #7b95aa; font-size: 13px; }
  .emr-top .spacer { margin-left: auto; }
  .emr-all, .emr-closebtn {
    background: #fff; border: 1px solid #9cc4e0; color: #14506f;
    border-radius: 999px; padding: 5px 15px; font-weight: 600; font-size: 13.5px;
    cursor: pointer; white-space: nowrap; font-family: inherit;
  }
  .emr-all:hover, .emr-closebtn:hover { background: #eaf4fc; }

  .emr-body { background: #fff; flex: 1 1 auto; min-height: 0; }
  .emr-split { display: flex; align-items: stretch; height: 100%; min-height: 0; }
  .emr-visits {
    flex: 0 0 320px; min-width: 240px; border-right: 1px solid #c9dcea;
    display: flex; flex-direction: column; background: #f6fafd;
  }
  .emr-visits-head { padding: 9px 12px; border-bottom: 1px solid #c9dcea; font-weight: 600; color: #1f5682; }
  .emr-visits-list { overflow-y: auto; flex: 1; min-height: 0; }
  .emr-visit {
    display: block; width: 100%; text-align: left; border: none; background: transparent;
    border-bottom: 1px solid #e4eef6; padding: 8px 12px; cursor: pointer; color: #24384d; font-family: inherit;
  }
  .emr-visit:hover { background: #e8f3fb; }
  .emr-visit.active, .emr-visit.active * { background: #1f6fa8; color: #fff; }
  .emr-visit .vd { font-weight: 600; font-size: 14px; }
  .emr-visit .vm { color: #7b95aa; font-size: 12.5px; }
  .emr-visit.active .vm { color: #dbecfa; }
  .emr-detail { flex: 1; overflow-y: auto; padding: 14px 16px; min-width: 0; }

  .emr-sec {
    display: flex; align-items: center; gap: 10px;
    background: #1f6fa8; color: #fff; font-weight: 600; padding: 6px 12px; margin: 14px 0 0;
    border-radius: 6px 6px 0 0; font-size: 14.5px;
  }
  .emr-sec:first-child { margin-top: 0; }
  .emr-sec.green { background: #4f8a2e; }
  .emr-sec .t { flex: 1 1 auto; }
  .emr-sec.collapsed { border-radius: 6px; }
  .emr-toggle {
    flex: 0 0 auto; background: #fff; border: 1px solid rgba(255,255,255,.85); color: #14506f;
    font-weight: 600; font-size: 12px; padding: 3px 12px; border-radius: 999px; cursor: pointer; white-space: nowrap; font-family: inherit;
  }
  .emr-toggle:hover { background: #eaf4fc; }
  .emr-box {
    border: 1px solid #c9dcea; border-top: none; border-radius: 0 0 6px 6px;
    padding: 10px 12px; font-size: 14.5px; color: #24384d;
  }
  .emr-box[hidden] { display: none !important; }
  .emr-pre { white-space: pre-wrap; word-break: break-word; line-height: 1.5; }
  .emr-note + .emr-note { border-top: 1px dashed #d8e6f1; margin-top: 8px; padding-top: 8px; }
  .emr-meta { color: #7b95aa; font-size: 12.5px; }
  .emr-key { color: #1f5682; font-weight: 600; }
  .emr-val { color: #b3271e; font-weight: 600; }
  .emr-none { color: #9ab2c4; }

  table.emr-table { width: 100%; border-collapse: collapse; }
  table.emr-table th, table.emr-table td { border: 1px solid #c9dcea; padding: 6px 10px; vertical-align: top; font-size: 14px; }
  table.emr-table th { background: #eaf3fa; color: #1f5682; font-weight: 600; text-align: left; white-space: nowrap; }
  table.emr-table td.num { text-align: right; font-variant-numeric: tabular-nums; }

  .spin { width: 34px; height: 34px; border-radius: 50%; border: 4px solid #cfe0ee; border-top-color: #1f6fa8; animation: spin .8s linear infinite; display: inline-block; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .center { text-align: center; padding: 40px 0; }

  @media (max-width: 900px) {
    html, body { height: auto; }
    .emr-body { height: auto; }
    .emr-split { flex-direction: column; height: auto; }
    .emr-visits { flex: none; border-right: none; border-bottom: 1px solid #c9dcea; max-height: 220px; }
  }
</style>
</head>
<body>
<script>window.__BOOT = "__BOOT__";</script>

<div class="emr-top">
  <span class="ttl">📄 Patient EMR</span>
  <span id="emrPatient"></span>
  <span id="emrVn"></span>
  <span class="spacer"></span>
  <button type="button" class="emr-all" id="emrToggleAll">ซ่อนทุกหัวข้อ</button>
  <button type="button" class="emr-closebtn" onclick="window.close()">✕ ปิด</button>
</div>

<div class="emr-body">
  <div class="emr-split">
    <aside class="emr-visits">
      <div class="emr-visits-head">เลือก VN ที่ต้องการดู</div>
      <div class="emr-visits-list" id="emrVisits"><div class="emr-none" style="padding:12px">กำลังโหลด…</div></div>
    </aside>
    <section class="emr-detail" id="emrBody">
      <div class="center"><span class="spin"></span></div>
    </section>
  </div>
</div>

<div id="toasts"></div>
<script src="/js/crypto.js"></script>
<script src="/js/api.js"></script>
<script src="/js/ui.js"></script>
<script src="/js/emrpage.js"></script>
</body>
</html>
